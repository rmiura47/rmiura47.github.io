name: YouTube再生リストから作品を更新

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 朝6:17(日本時間)
  workflow_dispatch:         # GitHubの画面から手動でも実行できる
  push:                      # 再生リストの設定や仕組みを変えたときもすぐ実行
    paths:
      - playlists.json
      - scripts/fetch_playlists.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_playlists.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet works-auto.json; then
            echo "変更なし"
          else
            git config user.name "portfolio-bot"
            git config user.email "portfolio-bot@users.noreply.github.com"
            git add works-auto.json
            git commit -m "作品一覧を自動更新"
            git push
          fi
